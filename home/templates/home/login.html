{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Gurukul AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'home/style.css' %}">
</head>
<body style="align-items: center; justify-content: center;">

    <div class="card" style="width: 100%; max-width: 400px; padding: 40px; text-align: center;">
        
        <div style="margin-bottom: 30px;">
            <i class="fa-solid fa-brain" style="font-size: 3rem; color: var(--primary); margin-bottom: 15px;"></i>
            <h2 style="font-weight: 600;">Welcome Back</h2>
            <p style="color: var(--text-muted);">Enter your credentials to access your workspace.</p>
        </div>

        <form method="post" style="text-align: left;">
            {% csrf_token %}
            
            <div style="margin-bottom: 15px;">
                <label style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 8px; display: block;">Username</label>
                {{ form.username }}
                </div>
            
            <div style="margin-bottom: 25px;">
                <label style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 8px; display: block;">Password</label>
                {{ form.password }}
            </div>

            <button type="submit" class="btn-glass btn-primary" style="width: 100%; justify-content: center;">Sign In</button>
        </form>

        <p style="margin-top: 20px; font-size: 0.9rem; color: var(--text-muted);">
            Don't have an account? <a href="{% url 'signup' %}" style="color: var(--primary);">Sign up</a>
        </p>
    </div>

    <style>
        /* Forces Django form inputs to look like our glass inputs */
        input {
            width: 100%;
            padding: 12px;
            background: rgba(0,0,0,0.2);
            border: 1px solid var(--border-glass);
            border-radius: 8px;
            color: white;
            outline: none;
        }
        input:focus {
            border-color: var(--primary);
        }
    </style>

</body>
</html>
